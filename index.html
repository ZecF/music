<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Web Player</title>
    <style>
        :root {
            --accent-color: #00ADB5; 
            --accent-hover: #00c6d0;
            --bg-main: #121215;
            --bg-card: #1e1e24;
            --bg-hover: #2b2b36;
            --text-main: #EEEEEE;
            --text-sub: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 40px 20px;
            padding-bottom: 150px; 
        }

        header {
            max-width: 900px;
            margin: 0 auto 40px auto;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 25px;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .search-container {
            display: flex;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 24px;
            border-radius: 30px;
            border: 1px solid transparent;
            background-color: var(--bg-card);
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: border 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus {
            border: 1px solid var(--accent-color);
            box-shadow: 0 0 10px rgba(0, 173, 181, 0.2);
        }

        button.search-btn {
            padding: 14px 30px;
            border-radius: 30px;
            border: none;
            background-color: var(--accent-color);
            color: #fff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.search-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        #status {
            max-width: 900px;
            margin: 0 auto 20px auto;
            color: var(--text-sub);
            font-size: 15px;
            text-align: center;
        }

        .track-list {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-radius: 12px;
            background-color: var(--bg-card);
            transition: background-color 0.2s, transform 0.1s;
        }

        .track-item:hover {
            background-color: var(--bg-hover);
            transform: scale(1.01);
        }

        .track-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            min-width: 0;
        }

        .track-index {
            color: var(--text-sub);
            font-size: 14px;
            width: 25px;
            text-align: center;
            font-weight: bold;
        }

        .track-cover-list {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            object-fit: cover;
            background-color: #333;
            transition: opacity 0.3s ease;
        }

        .track-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .track-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 13px;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-album {
            font-size: 14px;
            color: var(--text-sub);
            flex: 1;
            padding: 0 20px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .track-duration {
            font-size: 14px;
            color: var(--text-sub);
        }

        .play-btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s;
        }

        .track-item:hover .play-btn {
            opacity: 1;
        }

        .play-btn:hover {
            background-color: var(--accent-hover);
            transform: scale(1.05);
        }

        .player-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translate(-50%, 150%);
            width: calc(100% - 40px);
            max-width: 1000px;
            height: 90px;
            background: rgba(30, 30, 36, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 0 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .player-bar.active {
            transform: translate(-50%, 0);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 30%;
        }

        .player-info img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .player-text h4 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        .player-text p {
            font-size: 13px;
            color: var(--text-sub);
        }

        .player-audio {
            width: 40%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        audio {
            width: 100%;
            max-width: 500px;
            outline: none;
        }

        audio::-webkit-media-controls-panel {
            background-color: var(--bg-hover);
        }
        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display {
            color: var(--text-main);
        }

        .player-actions {
            width: 30%;
            display: flex;
            justify-content: flex-end;
        }

        .download-btn {
            background-color: transparent;
            border: 1.5px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }

        .download-btn:hover {
            background-color: var(--accent-color);
            color: #fff;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .track-album { display: none; }
            .player-bar {
                height: auto;
                flex-direction: column;
                gap: 15px;
                padding: 20px;
                bottom: 10px;
                width: calc(100% - 20px);
            }
            .player-info, .player-audio, .player-actions {
                width: 100%;
                justify-content: center;
                text-align: center;
            }
            .player-info { flex-direction: column; }
            .play-btn { opacity: 1; padding: 6px 14px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎧 Music Stream</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Cari lagu, artis, atau album..." onkeypress="handleKeyPress(event)">
            <button class="search-btn" onclick="searchMusic()">Cari</button>
        </div>
    </header>

    <div id="status"></div>
    <div class="track-list" id="trackList"></div>

    <div class="player-bar" id="playerBar">
        <div class="player-info">
            <img id="playerCover" src="" alt="Cover">
            <div class="player-text">
                <h4 id="playerTitle">-</h4>
                <p id="playerArtist">-</p>
            </div>
        </div>
        <div class="player-audio">
            <audio id="audioPlayer" controls controlsList="nodownload">
                <source id="audioSource" src="" type="audio/mpeg">
            </audio>
        </div>
        <div class="player-actions">
            <a href="#" id="downloadLink" class="download-btn" target="_blank" download>↓ Download</a>
        </div>
    </div>

    <script>
        const API_KEY = "Yes";
        const DEFAULT_ICON = 'https://img.icons8.com/m_rounded/200/FFFFFF/music--v1.png';

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                searchMusic();
            }
        }

        async function fetchCoverForList(spotifyUrl, imgId) {
            try {
                const targetUrl = `https://zynfx.eu.org/api/spotify?url=${encodeURIComponent(spotifyUrl)}&apikey=${API_KEY}`;
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(proxyUrl);
                const data = await response.json();

                if (data.status === 200 && data.result && data.result.metadata && data.result.metadata.cover) {
                    const imgElement = document.getElementById(imgId);
                    if (imgElement) {
                        imgElement.src = data.result.metadata.cover;
                    }
                }
            } catch (error) {
                console.log("Cover load error:", error);
            }
        }

        async function searchMusic() {
            const query = document.getElementById('searchInput').value.trim();
            const statusDiv = document.getElementById('status');
            const trackList = document.getElementById('trackList');

            if (!query) {
                alert("Masukkan judul lagu terlebih dahulu!");
                return;
            }

            statusDiv.innerHTML = "Mencari lagu... ⏳";
            trackList.innerHTML = "";

            try {
                const targetUrl = `https://zynfx.eu.org/api/spotifySearch?query=${encodeURIComponent(query)}&apikey=${API_KEY}`;
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(proxyUrl);
                const data = await response.json();

                if (data.status === 200 && Array.isArray(data.result) && data.result.length > 0) {
                    statusDiv.innerHTML = `Menampilkan hasil untuk "<strong>${query}</strong>"`;
                    
                    data.result.forEach((track, index) => {
                        const imgId = `cover-img-${index}`; 
                        const trackItem = document.createElement('div');
                        trackItem.className = 'track-item';
                        
                        trackItem.innerHTML = `
                            <div class="track-left">
                                <span class="track-index">${index + 1}</span>
                                <img id="${imgId}" src="${DEFAULT_ICON}" class="track-cover-list" alt="Album Art">
                                <div class="track-details">
                                    <span class="track-title">${track.name || 'Unknown'}</span>
                                    <span class="track-artist">${track.artist || 'Unknown Artist'}</span>
                                </div>
                            </div>
                            <div class="track-album">${track.album || '-'}</div>
                            <div class="track-right">
                                <span class="track-duration">${track.duration || '-'}</span>
                                <button class="play-btn" onclick="loadTrack('${track.spotifyUrl}')">Putar</button>
                            </div>
                        `;
                        trackList.appendChild(trackItem);

                        if (track.spotifyUrl) {
                            fetchCoverForList(track.spotifyUrl, imgId);
                        }
                    });
                } else {
                    statusDiv.innerHTML = "Lagu tidak ditemukan.";
                }
            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = `❌ Terjadi kesalahan saat mengambil data pencarian API.`;
            }
        }

        async function loadTrack(spotifyUrl) {
            const statusDiv = document.getElementById('status');
            const playerBar = document.getElementById('playerBar');
            
            statusDiv.innerHTML = "Memuat audio... ⏳";

            try {
                const targetUrl = `https://zynfx.eu.org/api/spotify?url=${encodeURIComponent(spotifyUrl)}&apikey=${API_KEY}`;
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(proxyUrl);
                const data = await response.json();

                if (data.status === 200 && data.result && data.result.metadata) {
                    const metadata = data.result.metadata;
                    const links = data.result.links;

                    const playerCoverImage = metadata.cover || DEFAULT_ICON;
                        
                    document.getElementById('playerCover').src = playerCoverImage;
                    document.getElementById('playerTitle').innerText = metadata.name || 'Unknown';
                    document.getElementById('playerArtist').innerText = metadata.artist || 'Unknown Artist';
                    
                    const audioPlayer = document.getElementById('audioPlayer');
                    document.getElementById('audioSource').src = links.mp3;
                    audioPlayer.load(); 
                    audioPlayer.play(); 

                    document.getElementById('downloadLink').href = links.mp3;

                    playerBar.classList.add('active');
                    statusDiv.innerHTML = "✅ Musik siap diputar!";
                } else {
                    statusDiv.innerHTML = "❌ Gagal memuat link audio.";
                }
            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = `❌ Gagal memproses audio.`;
            }
        }
    </script>
</body>
</html>
